<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model padding </title>
    <style>
        h2 {
            background-color: pink;
            padding: 30px 40px 50px 60px;
            border: double 10px blue;
            /* border: 10px double red; */
            /* border: 30px dashed orange; */
            width: 300px;
            margin-left: 30px;
            margin-right: 40px; 
        }
         p {
            background-color: lightyellow;
            /* padding: 40px; */
            border: solid 10px blue;
            padding: 15px;
            width: 300px;
            
        }
    </style>
</head>
<body>

    <h2>Box Model Padding Example</h2>

    <p>
        Padding is the space between the content and the border of an element.
        It helps create extra space inside the element, making the content easier to read.
    </p>
</head>
<body>
    
</body>
</html>
