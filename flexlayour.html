<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Height Columns Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .parent {
            /* 1. Display Types */
            display: flex;
            /* display: inline-flex; */

            /* 2. Flex Direction (Row wise) */
            flex-direction: row;
            /* flex-direction: row-reverse; */
            /* flex-direction: column; */
            /* flex-direction: column-reverse; */

            /* 3. Flex Wrap (Wraps to next row if space runs out) */
            flex-wrap: wrap;
            /* flex-wrap: nowrap; */
            /* flex-wrap: wrap-reverse; */

            /* 4. Main Axis Alignment */
            justify-content: flex-start;
            /* justify-content: space-around; */
            /* justify-content: space-between; */
            /* justify-content: space-evenly; */
            /* justify-content: center; */
            /* justify-content: flex-end; */

            /* 5. Cross Axis Alignment (Stretches from top to bottom) */
            align-items: stretch;
            /* align-items: center; */
            /* align-items: flex-start; */
            /* align-items: flex-end; */

            /* 6. Multi-line Cross Axis Alignment */
            align-content: stretch;
            /* align-content: flex-start; */
            /* align-content: center; */

            /* Container takes full screen width and height */
            width: 100vw;
            min-height: 100vh;

            /* Border around main container */
            border: 4px solid black;
            /* border: 3px dashed red; */
        }

        .child {
            /* flex-grow allows each column to share width equally */
            flex: 1 1 200px;
            /* flex: 1; */
            /* flex-grow: 0; */
            /* flex-shrink: 1; */

            /* Centers the text inside the full-height strip */
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 3rem;
            font-weight: bold;
            color: white;

            /* Borders between columns */
            border-right: 2px solid rgba(0, 0, 0, 0.2);
            /* border: 2px dashed white; */
        }

        /* Full Background Colors (Top to Bottom) */
        .child1 { 
            background-color: #e74c3c; 
            /* order: 2; */
        }

        .child2 { 
            background-color: #3498db; 
            /* align-self: flex-start; */
        }

        .child3 { 
            background-color: #2ecc71; 
            /* flex-grow: 2; */
        }

        .child4 { 
            background-color: #f39c12; 
            /* align-self: flex-end; */
        }

        .child5 { 
            background-color: #9b59b6; 
            /* flex-shrink: 2; */
        }

        .child6 { 
            background-color: #1abc9c; 
            /* order: -1; */
        }
    </style>
</head>
<body>

    <div class="parent">
        <div class="child child1">one</div>
        <div class="child child2">two</div>
        <div class="child child3">three</div>
        <div class="child child4">four</div>
        <div class="child child5">five</div>
        <div class="child child6">six</div>
    </div>

    

</body>
</html>
